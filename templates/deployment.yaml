{{- range $key, $value := .Values }}
{{- if and (ne $key "global") (ne $key "replicaCount") (ne $key "resources") (ne $key "ingress") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $key }}
  labels:
    app: {{ $.Release.Name }}
    component: {{ $key }}
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ $.Release.Name }}
      component: {{ $key }}
  template:
    metadata:
      labels:
        app: {{ $.Release.Name }}
        component: {{ $key }}
    spec:
      {{- if eq $key "frontend" }}
      hostAliases:
        - ip: "10.43.43.228"
          hostnames:
            - "gateway"
      {{- end }}
      containers:
        - name: {{ $key }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $value.image.repository }}:{{ $value.image.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: {{ $value.port }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
{{- end }}
{{- end }}